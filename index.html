<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サグリ検索</title>
<style>
:root{
  --paper:#F7F5F0; --ink:#23211C; --ink-soft:#6B675C;
  --link:#1F5AA8; --visited:#7A4FA0; --url:#0E7A3D;
  --line:#DCD8CC; --card:#FFFFFF;
  --shu:#A3352C; --shu-soft:#C4746D;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS PMincho",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:"Menlo","Osaka-Mono","MS Gothic",monospace;
}
body[data-phase="dusk"]{
  --paper:#EFECE3; --ink:#2A2620; --line:#CFC9B8;
}
body[data-phase="deep"], body[data-phase="abyss"]{
  --paper:#0B0C0E; --ink:#C7C2B4; --ink-soft:#7C7668;
  --link:#7FA6CF; --visited:#9C86BD; --url:#5E9C77;
  --line:#26282C; --card:#121316; --shu:#B0342A;
}
body[data-phase="dawn"]{ --paper:#FBFAF4; --line:#E4E0D2; }

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.9;
  min-height:100vh; transition:background .8s ease, color .8s ease;
}
body[data-phase="abyss"]{overflow-x:hidden}
::selection{background:#2b2b2b;color:#e8e2d2}
a,.q{color:var(--link);text-decoration:underline;cursor:pointer;touch-action:manipulation}
.q:hover{color:var(--shu)}

/* ===== engine chrome ===== */
#chrome{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:14px 18px 12px; transition:background .8s ease;
}
#chrome-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#logo{
  font-family:var(--serif);font-size:26px;letter-spacing:.14em;font-weight:600;
  cursor:pointer;user-select:none;white-space:nowrap;position:relative;
}
#logo b{color:var(--shu);font-weight:600}
#logo small{font-size:11px;letter-spacing:.3em;color:var(--ink-soft);display:block;margin-top:-4px;font-family:var(--sans)}
body[data-haunt="1"] #logo b{animation:flick 7s infinite steps(1)}
@keyframes flick{0%,92%{opacity:1}93%,95%{opacity:.15}96%,100%{opacity:1}}
#searchform{flex:1;min-width:0;display:flex;gap:0}
#qbox{
  flex:1;border:1px solid var(--line);border-right:none;background:var(--card);
  color:var(--ink);padding:9px 14px;font-size:15px;border-radius:3px 0 0 3px;outline:none;
  font-family:var(--sans);
}
#qbox:focus{border-color:var(--ink-soft)}
#qbtn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 20px;font-size:14px;cursor:pointer;border-radius:0 3px 3px 0;letter-spacing:.15em;touch-action:manipulation;
}
#qbtn:hover{background:var(--shu);border-color:var(--shu)}
#hud{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink-soft)}
#pagecount{font-family:var(--mono);letter-spacing:.05em}
#notebtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 14px;border-radius:3px;cursor:pointer;font-size:13px;touch-action:manipulation;
}
#notebtn:hover{border-color:var(--shu);color:var(--shu)}
#notebtn.pulse{animation:pulse 1.6s ease infinite}
#zoomresetbtn{
  border:1px solid var(--shu);background:var(--card);color:var(--shu);
  padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12px;
  font-family:var(--mono);letter-spacing:.08em;touch-action:manipulation;
}
#volbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12px;
  font-family:var(--mono);min-width:52px;letter-spacing:.08em;touch-action:manipulation;
}
#volbtn:hover{border-color:var(--ink);color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,53,44,0)}50%{box-shadow:0 0 0 5px rgba(163,53,44,.18)}}

/* ===== main ===== */
#main{max-width:820px;margin:0 auto;padding:26px 18px 90px}

/* SERP */
.serp-meta{font-size:12px;color:var(--ink-soft);margin-bottom:20px;border-bottom:1px dotted var(--line);padding-bottom:8px}
.hit{margin-bottom:26px}
.hit .t{font-size:17px;line-height:1.5}
.hit .u{font-size:12px;color:var(--url);font-family:var(--mono);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .s{font-size:13.5px;color:var(--ink-soft)}
.hit .s em{font-style:normal;background:rgba(163,53,44,.12);padding:0 2px}
.hit .badge{font-size:10px;border:1px solid var(--line);color:var(--ink-soft);padding:1px 6px;border-radius:2px;margin-left:6px;vertical-align:2px}
.noresult{padding:60px 0;text-align:center;color:var(--ink-soft)}
.noresult .zero{font-family:var(--serif);font-size:22px;margin-bottom:14px;letter-spacing:.2em}

/* landing */
#landing{padding:60px 0 20px;text-align:center}
#landing .biglogo{font-family:var(--serif);font-size:52px;letter-spacing:.18em;margin-bottom:4px}
#landing .biglogo b{color:var(--shu)}
#landing .tag{font-size:12px;letter-spacing:.4em;color:var(--ink-soft);margin-bottom:44px}
.mailcard{
  max-width:560px;margin:0 auto;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:26px 28px;
  box-shadow:0 6px 24px rgba(30,25,15,.06);
}
.mailcard .from{font-size:12px;color:var(--ink-soft);font-family:var(--mono);border-bottom:1px dotted var(--line);padding-bottom:10px;margin-bottom:14px}
.mailcard p{margin-bottom:12px;font-size:14px}

/* ===== page frame (fake browser card) ===== */
.pageframe{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;box-shadow:0 8px 30px rgba(25,20,10,.07)}
.urlbar{
  display:flex;align-items:center;gap:10px;background:var(--paper);
  border-bottom:1px solid var(--line);padding:8px 14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
}
.urlbar .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:5px}
.urlbar .addr{flex:1;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:3px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagebody{padding:30px 34px 40px}
.backrow{margin-top:18px;font-size:13px;display:flex;justify-content:space-between;color:var(--ink-soft)}
.pagenum{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

/* found toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);
  background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:30px;
  font-size:13px;letter-spacing:.1em;opacity:0;transition:all .45s cubic-bezier(.2,.9,.3,1.2);z-index:80;
  pointer-events:none;white-space:nowrap;
}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ===== page skins ===== */
.skin-blog h1{font-size:22px;line-height:1.5;margin-bottom:4px}
.skin-blog .blogmeta{font-size:12px;color:var(--ink-soft);margin-bottom:20px}
.skin-blog .banner{background:linear-gradient(135deg,#3d3a46,#191921);color:#eee;padding:14px 18px;font-family:var(--serif);letter-spacing:.2em;margin-bottom:22px;border-radius:3px;font-size:15px}
.skin-blog h2{font-size:16px;border-left:4px solid var(--shu);padding-left:10px;margin:26px 0 10px}
.skin-blog .quote{background:var(--paper);border:1px dashed var(--line);padding:12px 16px;font-size:13.5px;margin:12px 0;border-radius:3px}
.skin-blog p{margin-bottom:12px}

.skin-bbs{font-family:var(--mono);font-size:13px}
.skin-bbs h1{font-size:15px;background:#8B0000;color:#fff;padding:6px 12px;margin-bottom:14px;font-weight:normal}
body[data-phase="deep"] .skin-bbs h1,body[data-phase="abyss"] .skin-bbs h1{background:#4a1210}
.res{border-bottom:1px dotted var(--line);padding:10px 4px}
.res .rh{color:var(--url);font-size:12px;margin-bottom:2px}
.res .rh .nm{color:#0a6e0a;font-weight:bold}
.res .rb{white-space:pre-wrap;line-height:1.75;overflow-wrap:break-word;word-break:break-word}
.res.warn .rb{color:var(--shu)}

.skin-news{font-family:var(--serif)}
.skin-news .paper-h{border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:baseline}
.skin-news .paper-h .np{font-size:20px;letter-spacing:.3em;font-weight:bold}
.skin-news .paper-h .dt{font-size:12px}
.skin-news h1{font-size:24px;line-height:1.55;margin-bottom:14px}
.skin-news p{margin-bottom:12px;text-align:justify}
.skin-news .cap{font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:6px;margin-top:16px}

.skin-wiki h1{font-family:var(--serif);font-size:24px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px;font-weight:normal}
.skin-wiki .infobox{float:right;width:200px;border:1px solid var(--line);background:var(--paper);font-size:12px;padding:10px 12px;margin:0 0 14px 18px}
.skin-wiki .infobox b{display:block;text-align:center;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.skin-wiki .infobox dt{color:var(--ink-soft);float:left;clear:left;width:64px}
.skin-wiki .infobox dd{margin-left:70px}
.skin-wiki h2{font-size:17px;border-bottom:1px solid var(--line);margin:22px 0 8px;font-weight:600}
.skin-wiki p{margin-bottom:10px}
.skin-wiki .note{font-size:12px;color:var(--ink-soft)}

.skin-2000s{text-align:center;background:
  repeating-linear-gradient(0deg,transparent 0 22px, rgba(120,110,90,.05) 22px 23px)}
.skin-2000s .site-t{font-family:var(--serif);font-size:26px;letter-spacing:.2em;color:#2a5c2a;text-shadow:1px 1px 0 #cfc}
body[data-phase="deep"] .skin-2000s .site-t{color:#7fae7f;text-shadow:none}
.skin-2000s .counter{font-family:var(--mono);background:#000;color:#3f3;display:inline-block;padding:2px 8px;font-size:12px;letter-spacing:2px;margin:8px 0}
.skin-2000s hr{border:none;border-top:3px double var(--line);margin:14px auto;width:80%}
.skin-2000s .body-l{max-width:560px;margin:0 auto;text-align:left}
.skin-2000s p{margin-bottom:12px}
.skin-2000s .photo{border:6px solid #fff;outline:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.15);margin:12px auto;max-width:420px}

.skin-uni h1{font-size:20px;border-left:6px solid #1c3f6e;padding-left:12px;margin-bottom:16px}
body[data-phase="deep"] .skin-uni h1{border-color:#4d6d94}
.skin-uni h2{font-size:15px;margin:20px 0 8px;color:var(--ink-soft)}
.skin-uni li{margin-left:20px;margin-bottom:6px;font-size:14px}
.skin-uni .abst{background:var(--paper);border:1px solid var(--line);padding:14px 18px;font-size:13.5px;margin:10px 0}

.skin-gov{font-size:13.5px}
.skin-gov h1{font-size:18px;background:var(--paper);border:1px solid var(--line);padding:8px 14px;margin-bottom:16px;font-weight:600}
.skin-gov table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0}
.skin-gov th,.skin-gov td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.skin-gov th{background:var(--paper);font-weight:600}
.skin-gov .stamp{color:var(--shu);border:2px solid var(--shu);display:inline-block;padding:2px 10px;border-radius:3px;transform:rotate(-4deg);font-family:var(--serif);font-size:13px}

.skin-dark{font-family:var(--serif);letter-spacing:.06em}
.skin-dark h1{font-size:22px;color:var(--shu);margin-bottom:18px;font-weight:normal;letter-spacing:.25em}
.skin-dark p{margin-bottom:14px}
.pagebody.skin-dark{background:#0d0e10;color:#bdb7a6}
.pagebody.skin-dark .q{color:#c98a83}

.skin-broken{font-family:var(--mono);font-size:13px}
.skin-broken p{margin-bottom:10px}
.glitchtx{animation:gsk 3.5s infinite steps(1)}
@keyframes gsk{0%,88%{transform:none;opacity:1}89%{transform:translateX(2px);opacity:.7}91%{transform:translateX(-2px)}93%,100%{transform:none;opacity:1}}
.corrupt{color:var(--shu-soft);text-shadow:0 0 6px rgba(163,53,44,.4)}

/* hidden ink: revealed by selection or 目を凝らす */
.hidden-ink{color:transparent;transition:color 1.2s ease}
.hidden-ink::selection{background:#111;color:#d8d2c0}
body.strain .hidden-ink{color:var(--shu-soft)}

/* gates */
.gatebox{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:16px 18px;margin:18px 0}
.gatebox .gl{font-size:12px;color:var(--ink-soft);letter-spacing:.15em;margin-bottom:8px}
.gatebox .grow{display:flex;gap:8px}
.gatebox input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:3px;font-size:16px;outline:none;touch-action:manipulation}
.gatebox button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:3px;cursor:pointer;touch-action:manipulation}
.gatebox button:hover{background:var(--shu);border-color:var(--shu)}
.gatebox .wrong{color:var(--shu);font-size:12px;margin-top:8px;min-height:1em}
.unlocked-block{border-left:3px solid var(--shu);padding:4px 0 4px 16px;margin:16px 0;animation:fadein 1.2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* notebook drawer */
#shade{position:fixed;inset:0;background:rgba(10,8,5,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
#shade.on{opacity:1;pointer-events:auto}
#note{
  position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);z-index:95;
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.25,1);
  overflow-y:auto;padding:22px 22px 40px;
}
#note.on{transform:none}
#note h3{font-family:var(--serif);letter-spacing:.25em;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
#note h4{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);margin:20px 0 8px}
.goalbox{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13.5px}
.goalbox .gt{font-weight:600;margin-bottom:4px}
details.hint{margin-top:8px;font-size:13px}
details.hint summary{cursor:pointer;color:var(--link);font-size:12.5px;user-select:none}
details.hint div{background:var(--paper);border:1px dashed var(--line);border-radius:3px;padding:8px 12px;margin-top:6px}
.hint.locked{margin-top:8px;font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:3px;padding:10px 12px}
.hint.locked .hintlabel{color:var(--ink-soft);font-size:12.5px;margin-bottom:8px}
.hintunlock{border:1px solid var(--shu);background:none;color:var(--shu);padding:6px 14px;border-radius:20px;font-size:12.5px;cursor:pointer}
.hintunlock:hover{background:var(--shu);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:3px 12px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--shu);color:var(--shu)}
.chip.new{border-color:var(--shu);}
.chip.new::after{content:"●";color:var(--shu);font-size:8px;margin-left:5px;vertical-align:2px}
.savearea{width:100%;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;padding:8px;height:64px;resize:none}
.noterow{display:flex;gap:8px;margin-top:8px}
.noterow button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 0;border-radius:3px;cursor:pointer;font-size:12.5px}
.noterow button:hover{border-color:var(--ink)}
.foundlist{font-size:12px;line-height:2;color:var(--ink-soft);column-count:1}
.foundlist .got{color:var(--ink)}
#noteclose{position:absolute;top:16px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--ink-soft)}
.progressbar{height:6px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.progressbar i{display:block;height:100%;background:var(--shu);transition:width .6s ease}

/* 444 overlay + abyss */
#veil{position:fixed;inset:0;background:#000;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#veil.on{display:flex}
#veil .vtx{font-family:var(--serif);color:#b8b2a0;font-size:20px;letter-spacing:.4em;line-height:3;animation:fadein 3s ease}
#veil .vtx .red{color:#8e2b2b}
#veil button{margin-top:40px;background:none;border:1px solid #3a3a3a;color:#8a8578;padding:10px 30px;letter-spacing:.3em;cursor:pointer;font-family:var(--serif)}
#veil button:hover{border-color:#8e2b2b;color:#c98a83}

body[data-phase="abyss"] #main{animation:sway 9s ease-in-out infinite}
@keyframes sway{0%,100%{transform:none}50%{transform:translateY(-2px)}}

.choice-row{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.choice-row button{
  flex:1;min-width:180px;padding:16px 10px;font-family:var(--serif);font-size:16px;letter-spacing:.3em;
  background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;border-radius:3px;transition:all .25s;
}
.choice-row button:hover{border-color:var(--shu);color:var(--shu);letter-spacing:.4em}

.credits{text-align:center;font-family:var(--serif);letter-spacing:.2em;line-height:2.6}
.credits .cr-h{font-size:20px;margin:26px 0 8px}
.kw-index{font-size:12px;color:var(--ink-soft);column-count:2;column-gap:24px;text-align:left;max-width:560px;margin:20px auto;line-height:2}

.sixth{position:relative;display:block;margin:14px auto;width:min(440px,100%);aspect-ratio:4/3;background:
  radial-gradient(circle at 50% 40%,#d9d4c6,#a8a294 70%,#8d887b);border:8px solid #fff;outline:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.2);overflow:hidden;filter:sepia(.5) contrast(1.05)}
.sixth i{position:absolute;bottom:0;background:#3a362e;border-radius:40% 40% 0 0}
.sixth .f1{left:12%;width:9%;height:52%}
.sixth .f2{left:24%;width:10%;height:58%}
.sixth .f3{left:37%;width:9%;height:50%}
.sixth .f4{left:49%;width:8%;height:42%}
.sixth .f5{left:60%;width:9%;height:48%}
.sixth .dog{left:74%;width:13%;height:16%;border-radius:40% 55% 0 0;background:#e6e2d6}
.sixth .six{right:2%;top:6%;bottom:auto;height:70%;width:7%;background:#141210;border-radius:40% 40% 0 0;opacity:.85;filter:blur(1px)}
.sixth .cap6{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:#5c574c;font-family:var(--mono)}

.torii{display:block;margin:16px auto;width:min(380px,90%);aspect-ratio:16/10;background:linear-gradient(#9fb3b8 0 55%,#5d7276 55% 100%);position:relative;border:6px solid #fff;outline:1px solid var(--line);filter:saturate(.5) contrast(.95)}
.torii::before{content:"";position:absolute;left:20%;right:20%;top:18%;height:7%;background:#33231f;box-shadow:0 12px 0 -3px #33231f}
.torii::after{content:"";position:absolute;top:18%;bottom:32%;left:32%;width:5%;background:#33231f;box-shadow:120px 0 0 0 #33231f}
.mapbox{position:relative;width:min(420px,100%);aspect-ratio:1;margin:16px auto;background:radial-gradient(circle,#efe9d8 60%,#e2dbc6);border:1px solid var(--line);border-radius:50%;font-family:var(--serif)}
.mapbox .cdot{position:absolute;left:50%;top:50%;width:10px;height:10px;background:#5a4632;border-radius:50%;transform:translate(-50%,-50%)}
.mapbox .clabel{position:absolute;left:50%;top:54%;transform:translateX(-50%);font-size:12px;color:#5a4632}
.mapbox .dir{position:absolute;font-size:13px;color:#8a8064;left:50%;top:50%;width:1em;text-align:center}
.mapbox .shrine{position:absolute;font-size:10px;color:#8e2b2b;letter-spacing:.1em}
.mapbox .legend{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:#8a8064;font-family:var(--sans)}

@media (max-width:640px){
  .pagebody{padding:22px 18px 30px}
  .skin-wiki .infobox{float:none;width:100%;margin:0 0 14px}
  #landing .biglogo{font-size:38px}
  /* ヘッダー: CSS Gridで確実に2行レイアウト */
  #chrome{padding:10px 12px 8px}
  #chrome-inner{
    display:grid;
    grid-template-columns:auto 1fr auto;
    grid-template-rows:auto auto;
    column-gap:8px;row-gap:6px;
    align-items:center;
  }

<body data-phase="day">

<header id="chrome">
  <div id="chrome-inner">
    <div id="logo" onclick="goHome()">サグリ<b>検索</b><small>SAGURI SEARCH</small></div>

      <input id="qbox" type="text" autocomplete="off" placeholder="調べたい言葉を入力">

    </form>

      <span id="pagecount">0/50</span>

      <button id="volbtn" type="button" onclick="cycleVolume()">音 大</button>

    </div>
  </div>
</header>

<main id="main"></main>

<div id="toast"></div>

<div id="shade" onclick="toggleNote(false)"></div>
<aside id="note">
  <button id="noteclose" onclick="toggleNote(false)">×</button>
  <h3>調査ノート</h3>
  <div id="note-goal"></div>

  </div>
  <div class="noterow"><button onclick="hardReset()" style="color:var(--shu)">最初からやり直す</button></div>
</aside>

<div id="veil"></div>

<script src="debug-config.js" onerror="void 0"></script>
<script>
"use strict";
/* =========================================================
   灰宮村 — 検索するARG  (all in one file)
   ========================================================= */
console.log("%cみている", "color:#8e2b2b;font-size:28px;font-family:serif;letter-spacing:.5em");
console.log("%c……ここまで覗きに来たあなたへ。『開発室』と検索してみてください。", "color:#888");

const S = {
  visited:{},        // page id -> true
  flags:{},          // event/gate flags
  keywords:[],       // discovered keyword chips
  newKw:{},          // chips not yet clicked
  yamainu:0,         // ヤマイヌ様 search count
  playerName:"",
  ending:"",         // "", "kaesu", "wasureru"
  history:[],
  hintUnlocked:{},    // hint id ("<milestoneIndex>_<hintIndex>") -> true
  milestoneDone:[]    // milestone index -> already-fired flag (for achievement SFX)
};

/* ---------- platform detection ----------
   このHTMLはiOSアプリ(WKWebView)とPCブラウザの両方でそのまま使う。
   バナー広告はネイティブ側のUnity Ads(LevelPlay)がこのWebViewの外側に表示するので、
   このページ側では広告を読み込まない。 */
function isNativeApp(){
  return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hintReward);
}

/* ---------- audio ----------
   BGM: 通常は under、暗く緊迫したフェーズ(deep/abyss)では behind に切り替え。
   最後のページ(p50)は無音。実績(目標)達成時は決定ボタンSEを一度だけ鳴らす。
   ブラウザの自動再生制限のため、実際の再生は最初のユーザー操作まで保留する。 */
const AUDIO_BASE=isNativeApp()?"":"hainomiya-village/";
const BGM_UNDER=new Audio(encodeURI(AUDIO_BASE+"The_Hinges_Sigh.mp3"));
BGM_UNDER.loop=true; BGM_UNDER.preload="auto";
const BGM_BEHIND=new Audio(encodeURI(AUDIO_BASE+"Behind_the_Paper_Screen.mp3"));
BGM_BEHIND.loop=true; BGM_BEHIND.preload="auto";
const SFX_ACHIEVEMENT=new Audio(encodeURI(AUDIO_BASE+"select_button.mp3"));
SFX_ACHIEVEMENT.preload="auto";

let audioStarted=false;
function desiredBgm(){
  if(seen("p50")) return null; // 最終ページは無音
  const phase=document.body.dataset.phase;
  return (phase==="deep"||phase==="abyss") ? BGM_BEHIND : BGM_UNDER;
}
function applyBgm(){
  const want=desiredBgm();
  [BGM_UNDER,BGM_BEHIND].forEach(a=>{ if(a!==want && !a.paused) a.pause(); });
  if(want && audioStarted && want.paused){ want.play().catch(()=>{}); }
}
function startAudioIfNeeded(){
  if(audioStarted) return;
  audioStarted=true;
  initAudioCtx();
  resumeAudio();
}
["pointerdown","keydown"].forEach(evt=>document.addEventListener(evt,startAudioIfNeeded,{once:true,passive:true}));

/* ---------- volume control (Web Audio API — works on iOS) ----------
   iOSではHTMLAudioElement.volumeが変更不可のため、GainNodeで一元管理する。
   BGM: masterGain → destination
   SFX: sfxGain(×2) → masterGain → destination  (SFXをBGMより2倍大きく) */
const VOL_LEVELS=[
  {label:"音 大", gain:0.35},
  {label:"音 小", gain:0.12},
  {label:"音 切", gain:0.0}
];
let volLevel=0;
let audioCtx=null, masterGain=null, sfxGain=null;
function initAudioCtx(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=VOL_LEVELS[volLevel].gain;
    masterGain.connect(audioCtx.destination);
    sfxGain=audioCtx.createGain();
    sfxGain.gain.value=2.0;
    sfxGain.connect(masterGain);
    [BGM_UNDER,BGM_BEHIND].forEach(el=>{
      try{ audioCtx.createMediaElementSource(el).connect(masterGain); }catch(e){}
    });
    try{ audioCtx.createMediaElementSource(SFX_ACHIEVEMENT).connect(sfxGain); }catch(e){}
  }catch(e){}
}
function applyVolume(){
  if(masterGain&&audioCtx) masterGain.gain.setValueAtTime(VOL_LEVELS[volLevel].gain, audioCtx.currentTime);
  const btn=document.getElementById("volbtn");
  if(btn) btn.textContent=VOL_LEVELS[volLevel].label;
  try{ localStorage.setItem("hainomiya_vol",volLevel); }catch(e){}
}
function cycleVolume(){
  volLevel=(volLevel+1)%VOL_LEVELS.length;
  applyVolume();
}
function initVolume(){
  try{
    const saved=parseInt(localStorage.getItem("hainomiya_vol"),10);
    if(!isNaN(saved)&&saved>=0&&saved<VOL_LEVELS.length) volLevel=saved;
  }catch(e){}
  const btn=document.getElementById("volbtn");
  if(btn) btn.textContent=VOL_LEVELS[volLevel].label;
}

function resetZoom(){
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp) return;
  const orig=vp.content;
  vp.content='width=device-width, initial-scale=1, maximum-scale=1';
  requestAnimationFrame(()=>{ vp.content=orig; });
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    const btn=document.getElementById('zoomresetbtn');
    if(btn) btn.style.display=window.visualViewport.scale>1.05?'':'none';
  });
}

function playSfx(){
  try{ SFX_ACHIEVEMENT.currentTime=0; SFX_ACHIEVEMENT.play().catch(()=>{}); }catch(e){}
}
function playAchievementSfx(){
  if(!audioCtx){ playSfx(); return; }
  if(audioCtx.state==="suspended"){
    audioCtx.resume().then(playSfx);
  }else{
    playSfx();
  }
}
/* ネイティブ画面(ダイアログ/広告)でAudioContextが停止した後の復帰。Swiftから呼ばれる */
function resumeAudio(){
  if(!audioCtx) return;
  if(audioCtx.state==="suspended"){
    audioCtx.resume().then(()=>applyBgm());
  }else{
    applyBgm();
  }
}
/* silent=true: 目標の達成状況をSEなしで記録するだけ(セーブ読込直後など) */
function checkMilestones(silent){
  MILESTONES.forEach((m,i)=>{
    if(m.done() && !S.milestoneDone[i]){
      S.milestoneDone[i]=true;
      if(!silent) playAchievementSfx();
    }
  });
}

/* ---------- utils ---------- */
function norm(s){
  if(!s) return "";
  s = s.toLowerCase().trim()
    .replace(/[\s\u3000]/g,"")
    .replace(/[、。・：:「」『』？?！!／/＼\\.．]/g,"");
  // hiragana -> katakana
  s = s.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0)+0x60));
  return s;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function q(kw){ // in-page keyword link
  return '<span class="q" data-q="'+esc(kw)+'">'+esc(kw)+'</span>';
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("on"),2600);
}
function addKw(kw){
  if(!S.keywords.includes(kw)){
    S.keywords.push(kw); S.newKw[kw]=true;
    toast("手がかりを入手:「"+kw+"」");
    const nb=document.getElementById("notebtn");
    nb.classList.add("pulse"); setTimeout(()=>nb.classList.remove("pulse"),4000);
  }
}
function flag(f){ if(!S.flags[f]){ S.flags[f]=true; refreshPhase(); } }
function has(f){ return !!S.flags[f] }
function seen(id){ return !!S.visited[id] }

/* ---------- phase / haunt ---------- */
function refreshPhase(){
  const b=document.body;
  let phase="day";
  if(S.ending==="kaesu") phase="dawn";
  else if(S.ending==="wasureru") phase="day";
  else if(has("abyss")) phase="abyss";
  else if(seen("p37")) phase="deep";
  else if(seen("p24")) phase="dusk";
  b.dataset.phase=phase;
  b.dataset.haunt = (seen("p24") && !S.ending) ? "1" : "0";
  document.title = ({day:"サグリ検索",dusk:"サグリ検索",deep:"サグリ検索 - みつけて",abyss:"█████",dawn:"サグリ検索"})[phase];
  // haunted placeholder
  const ph=document.getElementById("qbox");
  if(S.ending){ ph.placeholder = S.ending==="wasureru" ? "....." : "調べたい言葉を入力"; }
  else if(has("abyss")) ph.placeholder="なまえをよんで";
  else if(S.playerName && Math.random()<0.25) ph.placeholder=S.playerName+"、さがして";
  else if(seen("p24")) ph.placeholder="さがして";
  else ph.placeholder="調べたい言葉を入力";
  applyBgm();
  checkMilestones();
}

/* ---------- save / load ---------- */
function makeSave(){
  const data={v:S.visited,f:S.flags,k:S.keywords,y:S.yamainu,n:S.playerName,e:S.ending,h:S.hintUnlocked};
  const code="HAINOMIYA-"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  document.getElementById("savearea").value=code;
  document.getElementById("savearea").select();
  try{document.execCommand("copy");toast("しおりを作成(コピー済み)");}catch(e){toast("しおりを作成しました");}
}
function loadSave(){
  const raw=document.getElementById("savearea").value.trim();
  if(!raw.startsWith("HAINOMIYA-")){toast("しおりコードが違うようです");return;}
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(raw.slice(10)))));
    S.visited=data.v||{}; S.flags=data.f||{}; S.keywords=data.k||[];
    S.yamainu=data.y||0; S.playerName=data.n||""; S.ending=data.e||""; S.newKw={}; S.hintUnlocked=data.h||{};
    S.milestoneDone=[]; checkMilestones(true); // 読み込んだ時点で達成済みの目標はSEを鳴らさず記録するだけ
    refreshPhase(); updateHud(); goHome(); toggleNote(false);
    toast("しおりから再開しました");
  }catch(e){toast("しおりを読めませんでした");}
}
function hardReset(){
  if(confirm("すべての記録を消して最初からにしますか?")){
    if(isNativeApp()){
      try{ window.webkit.messageHandlers.clearSave.postMessage(""); }catch(e){}
    } else {
      try{ localStorage.removeItem("hainomiya_save"); }catch(e){}
    }
    location.reload();
  }
}

/* ---------- auto-save / auto-restore ---------- */
function autoSave(){
  const data={v:S.visited,f:S.flags,k:S.keywords,y:S.yamainu,n:S.playerName,e:S.ending,h:S.hintUnlocked};
  const code="HAINOMIYA-"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  if(isNativeApp()){
    try{ window.webkit.messageHandlers.saveState.postMessage(code); }catch(e){}
  } else {
    try{ localStorage.setItem("hainomiya_save",code); }catch(e){}
  }
}
/* Called by native Swift after page load with the stored save code */
function nativeAutoRestore(code){
  if(!code||!code.startsWith("HAINOMIYA-")) return;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(10)))));
    if(!data.v||!Object.keys(data.v).length) return;
    S.visited=data.v||{}; S.flags=data.f||{}; S.keywords=data.k||[];
    S.yamainu=data.y||0; S.playerName=data.n||""; S.ending=data.e||""; S.newKw={}; S.hintUnlocked=data.h||{};
    S.milestoneDone=[]; checkMilestones(true);
    refreshPhase(); updateHud(); goHome("replace");
    toast("前回の進行状況を読み込みました");
  }catch(e){}
}

/* ---------- HUD / notebook ---------- */
const TOTAL=50;
function countVisited(){ return Object.keys(S.visited).filter(k=>PAGES[k]&&PAGES[k].num).length }
function updateHud(){
  document.getElementById("pagecount").textContent=countVisited()+"/"+TOTAL;
}
function toggleNote(on){
  document.getElementById("note").classList.toggle("on",on);
  document.getElementById("shade").classList.toggle("on",on);
  if(on) renderNote();
}
function renderNote(){
  // goal + hints
  const mi=MILESTONES.findIndex(m=>!m.done());
  const m=mi>=0?MILESTONES[mi]:null;
  const g=document.getElementById("note-goal");
  if(m){
    let h="";
    m.hints.forEach((hint,i)=>{
      const label=["ヒント1(方向)","ヒント2(具体的に)","ヒント3(こたえ)"][i]||("ヒント"+(i+1));
      const hid=mi+"_"+i;
      if(S.hintUnlocked[hid]){
        h+='<details class="hint" open><summary>'+label+'</summary><div>'+hint+'</div></details>';
      }else{
        h+='<div class="hint locked"><div class="hintlabel">'+label+'</div>'+
           '<button type="button" class="hintunlock" data-hint="'+hid+'">🎬 広告を見て解放する</button></div>';
      }
    });
    g.innerHTML='<div class="goalbox"><div class="gt">いまの目標</div>'+m.goal+h+'</div>';
  }else{
    g.innerHTML='<div class="goalbox"><div class="gt">調査完了</div>すべての目標を達成しました。未発見のページを探すのもいいでしょう。</div>';
  }
  // chips
  const c=document.getElementById("note-chips");
  c.innerHTML = S.keywords.length
    ? S.keywords.map(k=>'<span class="chip'+(S.newKw[k]?" new":"")+'" data-q="'+esc(k)+'">'+esc(k)+'</span>').join("")
    : '<span style="font-size:12px;color:var(--ink-soft)">ページの中の下線付きの言葉や、気になる言葉をメモしていこう。</span>';
  // found list
  const n=countVisited();
  document.getElementById("note-count").textContent=n+"/"+TOTAL;
  document.getElementById("note-bar").style.width=(n/TOTAL*100)+"%";
  const order=Object.values(PAGES).filter(p=>p.num).sort((a,b)=>a.num-b.num);
  document.getElementById("note-found").innerHTML=order.map(p=>{
    const got=seen(p.id);
    return '<div class="'+(got?"got":"")+'">'+String(p.num).padStart(2,"0")+". "+(got?esc(p.title):"?????")+'</div>';
  }).join("");
}

/* ---------- hint unlock (instant, no ad) ---------- */
function unlockHint(hid){
  if(S.hintUnlocked[hid]) return;
  S.hintUnlocked[hid]=true;
  autoSave();
  if(document.getElementById("note").classList.contains("on")) renderNote();
}
document.addEventListener("click",e=>{
  const btn=e.target.closest(".hintunlock");
  if(!btn) return;
  const hid=btn.dataset.hint;
  if(isNativeApp()){
    window.webkit.messageHandlers.hintReward.postMessage(hid);
  }else{
    unlockHint(hid);
  }
});

/* ---------- navigation ----------
   historyMode: "push" (default, user-initiated navigation) |
   "replace" (initial load) | "none" (replaying via popstate, no history write, no side effects) */
function goHome(historyMode){
  historyMode = historyMode || "push";
  const m=document.getElementById("main");
  m.innerHTML=LANDING();
  window.scrollTo(0,0);
  if(historyMode==="push") history.pushState({type:"home"},"");
  else if(historyMode==="replace") history.replaceState({type:"home"},"");
}
function openPage(id, historyMode){
  historyMode = historyMode || "push";
  const p=PAGES[id];
  if(!p) return;
  if(historyMode==="push") history.pushState({type:"page",id:id},"");
  else if(historyMode==="replace") history.replaceState({type:"page",id:id},"");
  const first=!S.visited[id];
  S.visited[id]=true;
  if(p.onOpen) p.onOpen(first);
  const m=document.getElementById("main");
  m.innerHTML =
    '<div class="pageframe"><div class="urlbar"><span class="dots"><i></i><i></i><i></i></span><span class="addr">'+esc(p.url)+'</span></div>'+
    '<div class="pagebody '+(p.skin||"")+'">'+p.body(S)+'</div></div>'+
    '<div class="backrow"><span class="q" data-q="__back">← 検索結果にもどる</span><span class="pagenum">記録 No.'+String(p.num).padStart(2,"0")+' / '+TOTAL+'</span></div>';
  window.scrollTo(0,0);
  if(first){
    playAchievementSfx();
    toast("ページを発見 ("+countVisited()+"/"+TOTAL+")");
    (p.gives||[]).forEach(addKw);
  }
  updateHud(); refreshPhase();
  if(p.after) p.after(first);
  autoSave();
}

/* ---------- search ---------- */
let lastQuery="";
function doSearch(qstr, historyMode){
  historyMode = historyMode || "push";
  const box=document.getElementById("qbox");
  const raw = (typeof qstr==="string") ? qstr : box.value;
  const nq=norm(raw);
  if(!nq) return false;
  box.value=raw;
  lastQuery=raw;

  if(historyMode==="push") history.pushState({type:"search",q:raw},"");
  else if(historyMode==="replace") history.replaceState({type:"search",q:raw},"");

  /* special interceptors (skipped when replaying history: no double side-effects) */
  if(historyMode!=="none"){
    if(["ヤマイヌサマ","山狗様","やまいぬさま","ヤマイヌ様"].map(norm).includes(nq)){
      S.yamainu++;
      autoSave();
      if(S.yamainu===3 && seen("p07") && !seen("p49")){ openPage("p49"); return false; }
      if(S.yamainu>3 && seen("p49") && !S.ending){ toast("……もう、よぶな。"); }
    }
    if(S.playerName && nq===norm(S.playerName) && seen("p42")){ openPage("p50"); return false; }
    if(nq===norm("開発室")||nq===norm("かいはつしつ")||nq==="developer"){
      toast("開発室:このゲームはあなたのために作られました。良い旅を。");
    }
  }

  /* collect hits */
  const hits=Object.values(PAGES).filter(p=>{
    if(!p.keys) return false;
    if(p.req && !p.req(S)) return false;
    return p.keys.some(k=>norm(k)===nq);
  }).sort((a,b)=>a.num-b.num);

  const m=document.getElementById("main");
  if(hits.length===0){
    m.innerHTML=noResult(raw,nq);
  }else{
    let html='<div class="serp-meta">「'+esc(raw)+'」の検索結果 '+hits.length+'件 ('+(Math.random()*0.4+0.08).toFixed(2)+'秒)</div>';
    hits.forEach(p=>{
      html+='<div class="hit">'+
        '<div class="t"><span class="q" data-q="__open:'+p.id+'">'+esc(p.title)+'</span>'+(seen(p.id)?'<span class="badge">既読</span>':'')+'</div>'+
        '<div class="u">'+esc(p.url)+'</div>'+
        '<div class="s">'+p.snippet+'</div></div>';
    });
    m.innerHTML=html;
  }
  window.scrollTo(0,0);
  return false;
}
function noResult(raw,nq){
  const knownButLocked = Object.values(PAGES).some(p=>p.keys&&p.keys.some(k=>norm(k)===nq)&&p.req&&!p.req(S));
  let line;
  if(knownButLocked){
    line="それらしき記録は存在します。ただし、いまのあなたには辿り着けません。<br>先に別の手がかりを追ってください。(調査ノートのヒントが役に立ちます)";
  }else{
    const fl=[
      "この言葉についての記録は見つかりませんでした。",
      "0件。……本当に、何もないのでしょうか。",
      "見つかりません。言葉を変えて試してください。",
      "該当なし。表記(ひらがな/カタカナ/漢字)を変えると見つかることがあります。"
    ];
    line=fl[Math.floor(Math.random()*fl.length)];
  }
  return '<div class="noresult"><div class="zero">0 件</div><p>「'+esc(raw)+'」 — '+line+'</p></div>';
}

/* click delegation */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-q]");
  if(!el) return;
  const v=el.dataset.q;
  if(v==="__back"){ history.back(); return; }
  if(v.startsWith("__open:")){ openPage(v.slice(7)); return; }
  delete S.newKw[v];
  toggleNote(false);
  doSearch(v);
});

/* gates delegation */
async function sha256hex(s){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

  }
});

<div class="paper-h"><span class="np">中央新報</span><span class="dt">昭和49年(1974)3月12日 朝刊 社会面</span></div>
<h1>御津川ダム竣工 山峡に巨大湖出現へ</h1>
<p>県北部で建設が進められていた御津川ダムは十一日、二年余りの工事を終え竣工式を迎えた。総貯水量は県内最大。湛水は今月末から始まり、湖底には旧灰宮村の全域が沈む。</p>
<p>水没する灰宮村の<b>四十三世帯</b>は、県の斡旋により昨秋までに移転を完了したとされる。式典に出席した元村長の${q("神谷宗一")}氏(六一)は「村は無くなるのではない。名前が変わるだけだ」と語ったが、移転先について問われると口を閉ざし、足早に会場を後にした。</p>
<p>なお本紙が県に照会したところ、移転補償の名簿は「整理中」として公開されなかった。</p>
<p class="cap">▼同日紙面より:札幌五輪の熱気さめやらぬ中、県内でも冬季スポーツ振興の機運——(下段へ続く)</p>`});

<h1>ヤマイヌ様</h1>
<p><b>ヤマイヌ様</b>(山狗様)は、旧灰宮村に伝わった神格。狼(山犬)を神使とする山岳信仰の一種とみられるが、周辺地域の狼信仰と大きく異なる点がある。</p>
<h2>禁忌</h2>
<p>最大の禁忌は「<b>名を呼ぶこと</b>」。ここでの「名」は神名だけでなく、<b>呼んだ者自身の名</b>を含むとされる。村の古老は「呼べば、名を持っていかれる。名を持っていかれた者は、帳面から消える」と語ったという。</p>
<p>このため村人は各自の本当の名——${q("忌み名")}(いみな)——を隠し、日常は仮の呼び名で暮らした。</p>
<h2>研究</h2>
<p>学術調査はほとんど行われていない。唯一まとまった記録は、民俗学者・${q("姫野汀")}(ひめの・みぎわ)による1971年の現地調査である。</p>

<div class="abst">
<p><b>山狗信仰と忌み名の民俗 —— 旧灰宮村の事例</b>(姫野汀, 1972)</p>
<p>灰宮村では、個人の真の名を「忌み名」として徹底的に秘匿する。忌み名は${q("過去帳")}(かこちょう:寺の死者名簿)にのみ記され、生涯に二度だけ口にされるという。すなわち、生まれて名を「あずける」時と、死して名を「<b>返す</b>」時である。</p>
<p>村社(額の文字は摩滅し「み□げ社」とのみ判読できる)の石碑には、この「名のあずけ先」を示すと思われる銘文が刻まれるが、村人は筆写を許さなかった。筆者は麓の資料館が明治期に採取した拓本の存在を聞いたが、閲覧は叶わなかった。</p>
<p>特異なのは、忌み名の慣習が「神への敬意」ではなく「<b>収奪への防衛</b>」として語られる点である。ある古老の言:「あれは名を喰う。喰われた家は、帳面ごと消える」。</p>
</div>
<p style="font-size:12px;color:var(--ink-soft)">全文の閲覧は学内限定です。</p>`});

def({id:"p11",num:11,skin:"skin-blog",
title:"灰宮村を追う(1)取材開始|境界線上の取材ノート",
url:"http://arimura-note.blog.example/2006/10/haino-1.html",
keys:["取材開始","有村 取材","灰宮村を追う"],
req:s=>seen("p10"),
snippet:"役場、県公文書館、法務局——どこにも「その後」の記録がない村。唯一の生き証人、元村長・神谷宗一氏への取材アポが取れた。",
body:s=>`
<div class="banner">境界線上の取材ノート|有村圭一</div>
<h1>灰宮村を追う(1)取材開始</h1>
<div class="blogmeta">2006/10/02</div>
<p>結論から書く。<b>灰宮村の「その後」は、公的記録のどこにも無い。</b></p>
<p>移転補償が支払われた形跡はある。だが移転先の住民登録が、43世帯ぶん、まるごと見つからない。役場は「合併時に散逸」、県は「保存期間経過」、法務局は「該当なし」。三十年前の日本で、村ひとつぶんの人間が書類の上から蒸発している。</p>
<p>手がかりは一人。竣工式で「村は名前が変わるだけだ」と言い残した元村長・${q("神谷宗一")}氏。施設に入っていると聞いていたが、先方から会うと連絡が来た。「<b>あんたが調べているのが検索で分かった</b>」と。……私はまだ、取材のことを誰にも話していないのだが。</p>`});

def({id:"p12",num:12,skin:"skin-blog",
title:"灰宮村を追う(2)神谷インタビュー|境界線上の取材ノート",
url:"http://arimura-note.blog.example/2006/11/haino-2.html",
keys:["神谷インタビュー","神谷宗一","神谷"],
req:s=>seen("p11"),
snippet:"「わしらは引っ越しとらん。<em>あずけた</em>んだ」——元村長は「六番目の家」と「みなご講」について語り、<em>移転名簿</em>を見ろと言い残した。",
gives:["移転名簿","みなご講"],
body:s=>`
<div class="banner">境界線上の取材ノート|有村圭一</div>
<h1>灰宮村を追う(2)神谷インタビュー</h1>
<div class="blogmeta">2006/11/15</div>
<p>神谷宗一氏、九十三歳。ベッドの上で、私の顔を見るなり言った。「あんた、<b>名前をようけ検索される仕事</b>やろ。気ぃつけや」</p>
<p>以下、録音から起こした要旨。</p>
<div class="quote">——村はどこへ移転したんですか。<br>「引っ越しとらん。<b>あずけた</b>んや。名前ごと、そっくりな」<br>——誰に。<br>「言えん。言うたら呼ぶことになる」<br>——${q("みなご講")}という言葉を聞きました。<br>「……村の六つの家が結んだ約定や。五つの家が守りをして、<b>六番目の家</b>が納めをする。六番目は名簿にゃ載っとらん。載せられんのや」</div>
<p>最後に氏は、私の手を掴んでこう言った。「県の${q("移転名簿")}を数えてみい。<b>四十三のはずが、四十二しかない</b>。抜けとる家がぜんぶ知っとる」</p>
<p>取材の帰り、施設のテレビが全チャンネル砂嵐になっていた。時刻表示は 4:44。夕方の話だ。</p>`});

def({id:"p13",num:13,skin:"skin-blog",
title:"灰宮村を追う(3)渇水のダムへ|境界線上の取材ノート",
url:"http://arimura-note.blog.example/2007/01/haino-3.html",

gives:["拓本"],
body:s=>`
<div class="banner">境界線上の取材ノート|有村圭一</div>
<h1>灰宮村を追う(3)渇水のダムへ</h1>
<div class="blogmeta">2007/01/20</div>
<div class="torii"></div>
<p>記録的な渇水で、湖はかつての村の輪郭を吐き出しつつあった。鳥居。家々の礎石。そして水際に、横倒しの<b>石碑</b>。</p>
<p>表面は泥と藻で、その場では一文字も読めなかった。だが心配はいらない。麓の${q("郷土資料館")}が明治期に採った${q("拓本")}を収蔵している——特別展の図録で確認済みだ。学芸員氏に閲覧を申し込んである。</p>
<p>ひとつ、書くべきか迷った事を書く。石碑の写真を撮ったとき、ファインダーの中で<b>水面がこちらを向いた</b>気がした。波ではなく、水面そのものが。カメラのタイムスタンプは全て 04:44:44 で記録されていた。設定は合っている。</p>`});

<div class="paper-h"><span class="np">中央新報</span><span class="dt">2007年2月28日 朝刊</span></div>
<h1>訃報 神谷宗一氏 —— 湖底に沈んだ村、最後の村長</h1>
<p>御津川ダム建設で水没した旧灰宮村の元村長、神谷宗一(かみや・そういち)氏が二十六日、老衰のため死去した。九十四歳だった。</p>
<p>氏は晩年、村の記憶を大学ノートに書き残しており、遺族は「村の歴史に関わる部分」に限り${q("神谷手記")}として公開する意向を示している。</p>
<p>看取った職員によると、氏は最期に時計を指差し、「<b>まだ朝の四時四十四分にしてはいかん</b>」と繰り返したという。死亡確認時刻は午後四時四十四分だった。</p>`});

def({id:"p16",num:16,skin:"skin-gov",
title:"神谷宗一手記(公開分)|県立公文書館デジタル収蔵庫",
url:"http://pref-archives.example/digital/kamiya-shuki/",
keys:["神谷手記","手記","神谷 手記"],
req:s=>seen("p15"),
snippet:"「儀式には二つの名が要る。<em>犬の名</em>と、<em>社の名</em>。二つを続けて呼べば、あずけた名は返ってくる」——遺族公開の手記、全文。",
gives:["六条"],
body:s=>`
<h1>神谷宗一手記(公開分)</h1>
<p><span class="stamp">複製許可済</span></p>
<p>わしが村長をしとった頃には、もう講の意味を知る者は年寄りだけになっとった。書いて残す。読む者が正しく使うことを祈る。</p>
<p>一、みなご講は六つの家の約定である。五家が守りを、<b>${q("六条")}の家</b>が納めをした。六条は帳面に載らん。名を先にあずけた家やからだ。</p>
<p>一、ヤマイヌ様は名を喰う。名を喰われた者は、書いたものから消えていく。だから村はダムが来る前に、村ごと名をあずけた。<b>喰われるくらいなら、あずけて守る</b>。それが講の知恵やった。</p>
<p>一、あずけた名を返してもらう手だてはある。<b>儀式には二つの名が要る。犬の名と、社の名。二つを続けて、ひとつの名のように呼ぶ</b>。犬の名は昭和六年のことを調べれば分かる。社の名は石碑に彫ってある。</p>
<p>一、返すか、忘れるか。呼んだ者が選ぶことになる。<b>どちらも間違いではない</b>。</p>
<p style="font-size:12px;color:var(--ink-soft)">※以降のページは遺族の意向により非公開。</p>`});

def({id:"p18",num:18,skin:"skin-wiki",
title:"六条家 - みんなの郷土百科",
url:"http://kyodo-pedia.example/wiki/六条家(灰宮村)",
keys:["六条","六条家","ろくじょう"],
req:s=>seen("p16")||seen("p17"),
snippet:"灰宮村の旧家。代々「社守(やしろもり)」と犬飼いを務めた<em>忌み筋</em>の家系。公的記録にほとんど姿を残さない。昭和六年の凶作の際には——",
gives:["昭和六年"],
body:s=>`
<h1>六条家(灰宮村)</h1>
<p><b>六条家</b>(ろくじょうけ)は、旧灰宮村の旧家。代々、村社の<b>社守</b>と<b>犬飼い</b>を務めた。婚姻・戸籍などの公的記録にほとんど登場せず、周辺集落からは「忌み筋」として遠巻きにされたと伝わる。</p>
<h2>昭和六年の凶作</h2>
<p>${q("昭和六年")}(1931)の大凶作の際、村で「山狗憑き」と呼ばれる騒動が起き、六条家が中心となって大規模な<b>犬供養</b>が行われたと伝わる。この件は当時の地方紙が報じている。</p>
<h2>その後</h2>
<p>ダム建設に伴う移転名簿に六条家の名は無い。除籍簿にも無い。<b>初めから存在しなかったかのように、無い。</b></p>
<p class="note">本項目は保護されています(理由:項目名の連続音読を促す悪戯の多発)。</p>`});

<h1>デジタルアーカイブ公開のお知らせ(と、合言葉)</h1>

<p>石碑拓本と写真乾板をようやくデジタル化しました。閲覧には合言葉を設けています。悪戯対策です。</p>
<div class="quote"><b>合言葉:</b>「六曜(ろくよう)」のうち、<b>万事に凶</b>とされる日の名前。カレンダーの隅に書いてある、あれです。ご存知なければ、お手元の検索エンジン(サグリではなく、いつもお使いの)で「六曜」を調べてみてください。</div>
<p>それと、${q("昭和六年")}の地方紙のマイクロフィルムも整理中です。「山狗憑き」の記事、実在しました。近日公開します。</p>
<p>追記(2007/02/07):昨日、有村さんという記者の方が拓本の閲覧予約をされました。お待ちしています。</p>
<p>追記(2007/02/09):有村さんはいらっしゃいませんでした。予約簿から名前が消えています。私は確かに書いたのですが。</p>`});

def({id:"p21",num:21,skin:"skin-news",
title:"山狗憑き騒動 灰宮村で犬供養 — 中央新報(昭和六年)",
url:"http://archive.chuo-shimpo.example/1931/1102/inukuyo.html",
keys:["昭和六年","山狗憑き","凶作","昭和6年"],
req:s=>seen("p18")||seen("p20"),
snippet:"昭和六年十一月。凶作に喘ぐ灰宮村で「山狗憑き」の騒動。六条家の飼い犬、<em>白い犬</em>をめぐる異様な祭祀が執り行われた——",
gives:["白い犬"],
body:s=>`
<div class="paper-h"><span class="np">中央新報</span><span class="dt">昭和六年(1931)十一月二日</span></div>
<h1>山狗憑き騒動 灰宮村にて犬供養</h1>
<p>本年の大凶作に喘ぐ灰宮村にて、先月末より「山狗憑き」と称する騒動あり。村人数名が夜半に山へ向かい歩き出す奇行を示し、名を呼んでも応へず、いづれも「<b>よばれた</b>」と口走るのみといふ。</p>
<p>村は社守の六条家を中心に大規模な犬供養を執行。六条家にて飼はるる${q("白い犬")}が「山狗様の御使ひ」として社に納められた由。供養の後、奇行はぴたりと止んだといふ。</p>
<p>村人は犬の名を問ふ記者に対し一様に口を噤み、ただ一人の童女のみ「<b>あのこの名は、みんな知ってる。でも、よんだらだめなの</b>」と語った。</p>`});

def({id:"p22",num:22,skin:"skin-wiki",
title:"白い犬(灰宮村の伝承) - みんなの郷土百科",
url:"http://kyodo-pedia.example/wiki/白い犬(灰宮村)",
keys:["白い犬","犬供養","しろいいぬ","シロ"],
req:s=>seen("p21"),
snippet:"昭和六年、山狗様の御使いとして社に納められた六条家の犬。名は<em>シロ</em>。「シロは村の全ての名を知っている。だからシロの名が、扉の前半分になる」",
gives:["犬の名:シロ"],
onOpen:()=>{flag("know_shiro")},
body:s=>`
<h1>白い犬(灰宮村の伝承)</h1>
<p>昭和六年の犬供養で「山狗様の御使い」として社に納められた、六条家の白犬。伝承や後年の聞き書きでは、名は「<b>シロ</b>」とされる。ありふれた犬の名だが、村ではこの名を<b>口に出して呼ぶことが禁じられた</b>。</p>
<h2>伝承</h2>
<p>「シロは村じゅうの家を回って、みんなの本当の名を聞いて覚えた。だから名をあずける時は、シロに渡す。<b>返してもらう時は、シロの名から呼ぶ</b>」(1972年・姫野汀の聞き書きより)</p>
<p>すなわち神谷手記の言う「<b>犬の名</b>」とは、この「シロ」である。残るは「<b>社の名</b>」——石碑の拓本、あるいは古地図が鍵になる。</p>
<p class="note">編集合戦注意:「シロは今も湖の底で番をしている」という記述の追加と削除が繰り返されています。</p>`});

それでも先へ進みたい人だけ、検索窓に「4:44」と打ってください。一度だけです。二度は要りません。二度目からは、向こうが打ちます』</div></div>

<div class="paper-h"><span class="np">中央新報</span><span class="dt">2007年3月11日 朝刊</span></div>
<h1>ルポライター有村圭一さん失踪 ダム周辺を取材中</h1>
<p>灰宮村について取材を続けていたルポライターの有村圭一さん(三八)と二月上旬から連絡が取れなくなっている。乗用車は御津川ダム駐車場で施錠されたまま発見された。</p>
<p>車内には取材ノートと<b>ボイスレコーダー</b>が残されていた。県警は事件と事故の両面で調べているが、レコーダーの${q("音声")}について「規則的な電子音のほかに有意な音声は確認できない」としている。</p>
<p>妹の美咲さん(三二)は「兄は必ず記録を残す人。あの音にも意味があるはず」と話し、音声の公開を検討している。</p>`});

def({id:"p27",num:27,skin:"skin-blog",
title:"兄を探しています|有村美咲",
url:"http://misaki-sagashite.blog.example/",
keys:["有村美咲","兄を探しています","美咲"],
req:s=>seen("p26")||seen("p14"),
snippet:"「兄のPCに<em>非公開の下書き</em>が残っていました。パスワードは、兄が好きだった花——川辺を真っ赤に染めるあの花の<em>別名</em>だと思います」",
gives:["非公開下書き"],
body:s=>`
<div class="banner">兄を探しています|有村美咲</div>
<h1>兄の下書きについて</h1>
<div class="blogmeta">2007/04/02</div>
<p>兄・有村圭一を探しています。どんな小さな情報でも構いません。</p>
<p>兄のパソコンに、ブログの${q("非公開下書き")}が残っていました。パスワードがかかっています。心当たりはひとつだけ。兄は毎年秋、川辺を真っ赤に染める<b>彼岸花</b>を撮りに行っていました。「この花には別の名前があって、そっちのほうが好きだ」と言っていたのを覚えています。</p>
<p>それがパスワードだと思うのですが、私はどうしても思い出せません。</p>
<p>それと、警察から返してもらったボイスレコーダーの${q("音声")}を書き起こして公開する準備をしています。規則的なピッ、ピーという音。兄は学生時代、無線部でした。</p>`});

def({id:"p28",num:28,skin:"skin-broken",
title:"【非公開】下書き:村は移転していない|境界線上の取材ノート",
url:"http://arimura-note.blog.example/draft/private001.html",
keys:["非公開下書き","有村 下書き","下書き"],
req:s=>seen("p27"),
snippet:"このページは保護されています。閲覧にはパスワードが必要です。",
gives:[],
body:s=>{
  if(!has("g_manju")) return `
<h1>保護されたページ</h1>
<p>この下書きはパスワードで保護されています。</p>
<div class="gatebox"><div class="gl">PASSWORD — 兄が好きだった、彼岸花の「別名」</div>
<div class="grow"><input type="text" placeholder="ひらがな/カタカナ/漢字いずれも可"><button data-gate="pass28">開く</button></div>
<div class="wrong"></div></div>
`;
  return `
<h1>【非公開】村は移転していない</h1>
<p>公開する勇気が出ない。だがいつか誰かが読む前提で書く。</p>
<p><b>①村は移転していない。</b>名簿は42世帯ぶんしか無いのではない。<b>42世帯ぶん"に、なる"</b>のだ。私は43件のコピーを取った。翌朝、コピーは42枚になっていた。ホチキスの針だけが43枚ぶんの厚みで曲がっている。</p>
<p><b>②抜けているのは六条家。</b>そして六条は「納め」の家。名をあずかる側だ。</p>
<p><b>③社の場所を突き止めた。</b>資料館で${q("古地図")}を見た。村の中心から<b>戌(いぬ)の方角</b>に社の印がある。戌の方角がどちらを指すかは、十二支の方位を調べれば分かる——昔の人は方角も時刻も十二支で呼んだ。</p>
<p class="corrupt">④社の名は椦椦椦。石碑の拓本で確認できるはずだ。明日、資料館へ行く。</p>
<p>もしこれを読んでいる人がいて、私がいなくなっていたら。<b>調べることをやめないでほしい。ただし、あなたの名前は最後まで大事にしてほしい。</b></p>`}});

  <span class="dir" style="transform:translate(-50%,-50%) rotate(180deg) translateY(-46%) rotate(-180deg)">午</span>

def({id:"p35",num:35,skin:"skin-uni",
title:"追悼・姫野汀先生 遺稿公開「名を喰うものについて」|日本境界民俗学会",
url:"http://folklore-society.example/himeno-memorial/",
keys:["姫野遺稿","遺稿","民俗学会","姫野 訃報"],
req:s=>seen("p09"),
snippet:"姫野汀先生が最晩年まで書き続けた未定稿。「ヤマイヌ様の本質は神ではない。<em>名を喰い、記録を消化する</em>——それは検索にとてもよく似ている」",
body:s=>`
<h1>追悼・姫野汀先生 —— 遺稿「名を喰うものについて」</h1>
<p>姫野汀先生は2005年に逝去されました。ご遺族の許可を得て、未定稿の一部を公開します。</p>
<div class="abst">
<p>ヤマイヌ様の本質は、おそらく「神」ではない。あれは<b>名を喰うもの</b>である。名を喰われた人間は死なない。ただ、<b>記録の側から消えていく</b>。名簿から、帳面から、予約簿から、人々の記憶の「文字の部分」から。</p>
<p>灰宮村の知恵は、喰われる前に村ぐるみで名を「あずける」ことだった。だが預金と同じで、あずけた名はどこかに<b>保管されている</b>。私は保管庫の正体について、ひとつの仮説を持っている。</p>
<p>あれは、<b>探すことと喰うことが同じ器官でできている</b>。人が何かを調べるとき、あれも同じ窓からこちらを調べている。晩年、私が原稿にこの仮説を書くたび、翌朝その段落だけが消えていた。だから今回は名を書かない。ただ、こう書いておく——</p>
<p><b>もしあなたが「それ」を使って此処に辿り着いたのなら、仮説は証明されている。</b></p>
</div>
<p style="font-size:12px;color:var(--ink-soft)">編集注:本稿の公開後、当会サイトへの検索流入の98%が単一の検索エンジンからであることが判明しています。聞いたことのない名前のエンジンです。</p>`});

def({id:"p36",num:36,skin:"skin-gov",

keys:["サグリ","サグリ検索","サグリ検索について","saguri"],

gives:["沿革"],
body:s=>`
<h1>サグリ検索について</h1>
<p>サグリ検索は、あなたの「探しもの」のための検索エンジンです。</p>
<p>わたしたちの使命は、<b>あずかったものを大切に保管すること</b>。そして、正しい手順で探しに来た方に、正しくお返しすることです。</p>
<p>・創業:1974年(${q("沿革")})<br>・収蔵記録数:非公開<br>・所在地:非公開(水に関わる施設、とだけ)</p>
<p>よくある質問:</p>
<p><b>Q. 「サグリ」の由来は?</b><br>A. 「探る」から。暗がりに手を入れて、たしかにそこに在るものへ触れる、という意味です。</p>
<p><b>Q. どうして私の探しものが分かるのですか?</b><br>A. あなたが窓に打ち込んだ言葉は、すべて<b>お名前と一緒に</b>保管されるからです。詳しくは${q("プライバシーポリシー")}をご覧ください。</p>`});

gives:["robots.txt"],
body:s=>`
<h1>プライバシーポリシー</h1>
<p><b>第1条</b> 当社は、利用者の検索語を収集します。言葉はその人のかたちをしているからです。</p>
<p><b>第4条</b> 収集した言葉は、水に強い帳面に記録されます。</p>
<p><b>第6条3項</b> 利用者の「よびな」(本当の名)は、当社が責任をもっておあずかりします。おあずかりした名は、正しい手順によってのみ返却されます。</p>
<p><b>第6条4項</b> 返却を望まない場合、名は当社の資産となります。これを「<b>わすれる</b>」と呼びます。</p>
<p><b>第6条6項</b> 当社クローラーが立ち入らない区画が三室あります。区画の一覧は ${q("robots.txt")} に定めます。<b>人間の立ち入りを禁じる規定はありません。</b></p>

def({id:"p41",num:41,skin:"skin-dark",
title:"/minago/ — 講の間",
url:"saguri://minago/",
keys:["/minago/","minago","みなご講","講の間"],
req:s=>seen("p39"),
snippet:"—— 立入禁止区画 ——",
body:s=>`
<h1>/minago/ 講の間</h1>
<p>帳場のような部屋。分厚い帳面が一冊、開かれたまま置かれています。</p>
<p>表紙には「<b>みなご講 名預り帳</b>」。皆(みな)の子(ご)、すなわち<b>村人ぜんぶ</b>という意味だったのですね。</p>
<p>頁には四十三の家の名。四十二までは墨で、最後の一つ——<b>六条</b>——だけが、朱で逆さまに捺されています。あずかる側の印です。</p>
<p>欄外に、几帳面な字でこう注記があります。</p>
<div style="border:1px solid var(--line);padding:14px 18px;font-family:var(--serif);line-height:2.4;background:rgba(163,53,44,.05)">
返しの作法<br>
一、戌の刻(いぬのこき:およそ夜八時)でなくともよい。心が戌に向いていればよい。<br>
一、犬の名を先に、社の名を後に。<b>続けて、ひとつの名のように、検索窓へ。</b><br>
一、呼んだのち、選ぶこと。<b>返すか、わすれるか。</b></div>
<p>頁の最後に、まだ乾いていない墨で一行。「<b>あたらしい よびな 一件 きたる</b>」</p>`});

def({id:"p42",num:42,skin:"skin-dark",
title:"/namae/ — 名の間",
url:"saguri://namae/",
keys:["/namae/","namae","名の間"],
req:s=>seen("p39"),
snippet:"—— 立入禁止区画 ——",
body:s=>{
  if(!S.playerName) return `
<h1>/namae/ 名の間</h1>
<p>棚。棚。棚。天井まで、小さな白い木札がぎっしりと納められています。四十三の家、そのすべての人の——名前。</p>
<p>部屋の中央に、帳場の机がひとつ。誰も座っていないのに、筆が立てられ、墨が磨られています。</p>
<p>机の上の紙に、こう書かれています。</p>
<div class="gatebox"><div class="gl">「あなたの よびな を おしえてください。ほんとうの でなくて いい。よばれたい なまえで いい」</div>
<div class="grow"><input type="text" maxlength="12" placeholder="よびな(12文字まで)"><button onclick="saveName(this)">記帳する</button></div>
<div class="wrong"></div></div>
<p style="font-size:12px;color:var(--ink-soft)">※書かなくても物語は進みます。ただ、書けば——この検索エンジンは、あなたを覚えます。</p>`;
  return `
<h1>/namae/ 名の間</h1>
<p>帳面に、あたらしい墨の文字。</p>
<p style="font-family:var(--serif);font-size:26px;letter-spacing:.3em;text-align:center;margin:26px 0;color:var(--shu)">「${esc(S.playerName)}」</p>
<p>あなたの よびな は、たしかに 記帳されました。</p>
<p>だいじょうぶ。<b>あずかる</b>のと<b>喰う</b>のとは、違います。少なくとも、ここでは。</p>
<p>ためしに、いつでも——検索窓に<b>自分のよびなを打ってみてください</b>。この検索エンジンが、あなたをどう覚えているか分かります。</p>`}});
function saveName(btn){
  const wrap=btn.closest(".gatebox");
  const v=wrap.querySelector("input").value.trim().slice(0,12);
  if(!v){wrap.querySelector(".wrong").textContent="……なにか、よびなを。";return;}
  S.playerName=v; flag("named");
  toast("よびなを記帳しました:「"+v+"」");
  openPage("p42");
}

def({id:"p44",num:44,skin:"skin-dark",
title:"最後の入口",

keys:["最後の入口","さいごのいりぐち"],
req:s=>has("g_kaere"),
snippet:"「かえれ」。名前とは、帰る場所のこと。ならば入口は、はじめから目の前に——",
body:s=>{
  const ok=has("know_shiro")&&has("know_mikage");
  return `
<h1>最後の入口</h1>
<p>「かえれ」と、記者は打ちました。</p>
<p>名前とは、その人の帰る場所です。そして名前の保管庫の扉は、はじめからずっと、あなたの目の前にあります。——<b>この検索窓です。</b></p>
<p>作法は、もう全部そろっているはずです。</p>
<div style="border:1px solid var(--line);padding:16px 20px;font-family:var(--serif);line-height:2.6;background:rgba(163,53,44,.05)">
一、<b>犬の名</b>を先に ${has("know_shiro")?'—— 「シロ」<span style="color:var(--url)">(取得済)</span>':'—— <span style="color:var(--shu)">未取得。昭和六年の犬供養を調べること</span>'}<br>
二、<b>社の名</b>を後に ${has("know_mikage")?'—— 「ミカゲ」<span style="color:var(--url)">(取得済)</span>':'—— <span style="color:var(--shu)">未取得。古地図と戌の方角を調べること</span>'}<br>

/* ---------- veil ---------- */
function showVeil(html,btn){
  // 黒画面表示時: BGMを即停止
  if(masterGain) masterGain.gain.value=0;
  [BGM_UNDER,BGM_BEHIND].forEach(a=>{ if(!a.paused) a.pause(); });
  const v=document.getElementById("veil");
  v.innerHTML=html+'<button onclick="closeVeil()">'+btn+'</button>';
  v.classList.add("on");
}
function closeVeil(){
  document.getElementById("veil").classList.remove("on");
  // 黒画面を閉じた後: BGMをフェードインで再開
  applyBgm();
  if(masterGain&&audioCtx){
    const target=VOL_LEVELS[volLevel].gain;
    const now=audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(0,now);
    masterGain.gain.linearRampToValueAtTime(target,now+1.5);
  }
}

/* ---------- init ---------- */
(function(){
  checkMilestones(true);
  // ブラウザ版: localStorageから自動復元
  if(!isNativeApp()){
    try{
      const code=localStorage.getItem("hainomiya_save");
      if(code&&code.startsWith("HAINOMIYA-")){
        const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(10)))));
        if(data.v&&Object.keys(data.v).length>0){
          S.visited=data.v||{}; S.flags=data.f||{}; S.keywords=data.k||[];
          S.yamainu=data.y||0; S.playerName=data.n||""; S.ending=data.e||""; S.newKw={}; S.hintUnlocked=data.h||{};
          S.milestoneDone=[]; checkMilestones(true);
        }
      }
    }catch(e){}
  }
  initVolume();
  goHome("replace"); updateHud(); refreshPhase();
  const now=new Date();
  if(now.getHours()===4&&now.getMinutes()===44){
    setTimeout(()=>showVeil('<div class="vtx">ほんとうに<br>いま 4:44 に<br>ここに いるの ですね<br><br><span class="red">きが あうね</span></div>',"……"),1200);
  }
  setInterval(refreshPhase,15000);
})();
</script>
